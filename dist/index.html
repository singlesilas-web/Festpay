<!doctype html>
<!-- =========================================================
     index.html – STARTSEITE / KARTE
     Gast verschiebt die Karte, landet der Pin in einer Fest-Zone,
     erscheint das Fest unten im Sheet. Logik: js/pages/karte.js
     ========================================================= -->
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=4, user-scalable=yes, viewport-fit=cover" />
  <title>NearBuy</title>
  <meta name="application-name" content="NearBuy" />
  <meta name="apple-mobile-web-app-title" content="NearBuy" />
  <meta name="theme-color" content="#02513C" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/nearbuy-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="description" content="Digital bezahlen auf Festen – ohne Kasse, ohne Papierwertkarte." />
  <link rel="icon" type="image/png" href="img/favicon.png?v=20261114-green" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css?v=20261114-green" />
  <link rel="stylesheet" href="css/test.css?v=20261114-green" />
  <link rel="stylesheet" href="css/components.css?v=20261114-green" />
  <link rel="stylesheet" href="css/karte.css?v=20261116-ux" />
<link rel="stylesheet" href="css/study.css?v=20261114-green"><link rel="stylesheet" href="css/polish.css?v=20261114-green" /></head>
<body data-tab="entdecken">
  <div class="app">
    <div class="map-wrap" id="mapWrap">
      <div class="map" id="map"></div>

      <div class="pin"><div class="pin-head"><i data-lucide="footprints" id="pinIcon"></i></div><div class="pin-dot"></div></div>

      <div class="brand-pill"><img src="img/logo.png?v=20261114-green" alt="" />NearBuy</div>
      <div class="map-ui left">
        <button class="icon-btn" id="btnSearch" aria-label="Feste suchen"><i data-lucide="search"></i></button>
      </div>
      <div class="map-ui right">
        <button class="icon-btn" data-track="menu-open" data-menu aria-label="Menü"><i data-lucide="menu"></i></button>
      </div>
      <div class="map-ui zoom" aria-label="Kartenzoom">
        <button class="icon-btn" id="zoomIn" aria-label="Karte vergrößern">+</button>
        <button class="icon-btn" id="zoomOut" aria-label="Karte verkleinern">−</button>
      <button class="icon-btn" id="btnLocate" aria-label="Zum nächsten Fest"><i data-lucide="navigation"></i></button>
      </div>

      <div class="sheet" id="sheet"></div>

      <div class="search-panel" id="searchPanel">
        <div class="row" style="margin-bottom:18px"><h2>Feste</h2><div class="spacer"></div>
          <button class="icon-btn light" id="btnSearchClose" aria-label="Schließen"><i data-lucide="x"></i></button></div>
        <div class="list" id="festList"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.2/dist/umd/supabase.min.js"></script>
  <script src="js/study-link.js?v=10"></script><script src="js/config.js?v=10"></script>
  <script src="js/demo-data.js?v=20261114-green"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js?v=20261114-green"></script>
  <script src="js/layout.js?v=20261114-green"></script>
  <script src="js/test-tasks.js?v=10"></script>
  <script src="js/telemetry.js?v=20261114-green"></script>
  <script src="js/pages/karte.js?v=20261116-ux"></script>
</body>
</html>
