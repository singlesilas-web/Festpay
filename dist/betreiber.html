<!doctype html>
<!-- =========================================================
     betreiber.html – BETREIBER: Fest anlegen, Zone zeichnen, Aufladebeträge und Speisekarte pflegen.
     Logik: js/pages/betreiber.js   ·   Styles: css/seiten.css
     ========================================================= -->
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=4, user-scalable=yes, viewport-fit=cover" />
  <title>FestPay – Betreiber-Bereich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/test.css?v=7" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/seiten.css" />
  <style>
    /* Give the operator form room at normal size and when zooming out. */
    .operator-page .app { max-width: 720px; display: flex; flex-direction: column; }
    .operator-page #root { flex: 1; display: flex; flex-direction: column; }
    .operator-page .topbar,
    .operator-page .page-head { padding-inline: clamp(20px, 4vw, 40px); }
    .operator-page .page-head { padding-top: 28px; padding-bottom: 12px; }
    .operator-page .festival-form {
      flex: 1; display: flex; flex-direction: column;
      gap: clamp(24px, 2.5vh, 48px);
      padding: 24px clamp(20px, 4vw, 40px) 40px;
    }
    .operator-page .festival-form > * + * { margin-top: 0; }
    .operator-page #tabFest {
      flex: 1; display: flex; flex-direction: column;
      justify-content: space-between; gap: clamp(16px, 1.5vh, 32px);
    }
    .operator-page #tabFest > * { flex-shrink: 0; }
    .operator-page #tabFest > * + * { margin-top: 0; }
    .operator-page #tabFest > h3,
    .operator-page #w1box > h3,
    .operator-page #w2box > h3 { margin-top: 16px !important; margin-bottom: 8px; }
    .operator-page #tabFest .mini-map { width: 100%; }
    .operator-page .festival-form .card { padding: clamp(20px, 3vw, 28px); }
    .operator-page .festival-form .card.stack > * + * { margin-top: 16px; }
    .operator-page .festival-form .input { min-width: 0; }
    .operator-page .festival-form .row .icon-btn { flex-shrink: 0; }
    .operator-page .festival-form .grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .operator-page .festival-dates { gap: 20px; }
    .operator-page .festival-form > #save { margin-top: 8px; min-height: 56px; }
    @media (min-width: 540px) {
      .operator-page .festival-dates .input { font-size: 15px; padding-inline: 12px; }
      .operator-page .festival-form .switch { padding-block: 20px; }
    }
    @media (min-width: 700px) {
      .operator-page { padding-inline: 24px; }
    }
    @media (max-width: 359px) {
      .operator-page .festival-dates,
      .operator-page .festival-form .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .operator-page .festival-dates .input { font-size: 14px; padding-inline: 12px; }
    }
  </style>
</head>
<body class="operator-page">
  <div class="app">
    <div class="topbar">
      <button class="icon-btn light" onclick="history.length > 1 ? history.back() : (location.href='index.html')" aria-label="Zurück"><i data-lucide="arrow-left"></i></button>
      <button class="icon-btn" data-menu aria-label="Menü"><i data-lucide="menu"></i></button>
    </div>
    <main id="root"></main>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/demo-data.js?v=7"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/layout.js?v=7"></script>
  <script src="js/test-tasks.js?v=7"></script>
  <script src="js/telemetry.js?v=7"></script>
  <script src="js/pages/betreiber.js"></script>
</body>
</html>
